services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        REACT_APP_API_URL: ${REACT_APP_API_URL:-http://localhost:8080/api}
    container_name: milyfe_prod_frontend_app
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - milyfe_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost"]
      interval: 30s
      timeout: 5s
      retries: 3

networks:
  milyfe_network:
    driver: bridge

